<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — StudyGenie AI</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="brand-icon">🎓</div>
      <span style="font-size:20px;font-weight:800;background:linear-gradient(135deg,#4f46e5,#7c3aed);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">StudyGenie AI</span>
    </div>
    <h2 style="text-align:center;font-weight:800;margin-bottom:4px;">Create your account</h2>
    <p style="text-align:center;color:var(--text-muted);font-size:14px;margin-bottom:28px;">Start your AI-powered study journey</p>

    <div id="auth-error" class="alert alert-danger mb-2" style="display:none;"></div>

    <form id="register-form">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input type="text" name="name" class="form-control" placeholder="Your name" required>
      </div>
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" placeholder="At least 8 characters" required minlength="8">
      </div>
      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <input type="password" name="confirm_password" class="form-control" placeholder="Repeat your password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;padding:11px;font-size:15px;margin-top:8px;">Create Account</button>
    </form>

    <p style="text-align:center;font-size:14px;margin-top:20px;color:var(--text-muted);">
      Already have an account? <a href="/login" style="color:var(--primary);font-weight:600;">Sign in</a>
    </p>
    <p style="text-align:center;font-size:13px;margin-top:8px;">
      <a href="/" style="color:var(--text-muted);">← Back to home</a>
    </p>
  </div>
</div>
<div class="toast-container"></div>
<script src="/static/js/main.js"></script>
<script src="/static/js/auth.js"></script>
</body>
</html>
