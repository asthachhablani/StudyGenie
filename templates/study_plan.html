<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Plan — StudyGenie AI</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand"><a href="/" class="brand-logo"><div class="brand-icon">🎓</div><span>StudyGenie AI</span></a></div>
    <nav class="sidebar-nav">
      <a href="/dashboard" class="nav-link"><span class="nav-icon">📊</span> Dashboard</a>
      <a href="/subjects" class="nav-link"><span class="nav-icon">📚</span> Subjects</a>
      <a href="/upload" class="nav-link"><span class="nav-icon">📤</span> Upload Notes</a>
      <a href="/study-assistant" class="nav-link"><span class="nav-icon">🤖</span> Study Assistant</a>
      <a href="/summary" class="nav-link"><span class="nav-icon">📋</span> Summaries</a>
      <a href="/flashcards" class="nav-link"><span class="nav-icon">🃏</span> Flashcards</a>
      <a href="/quiz" class="nav-link"><span class="nav-icon">✏️</span> Quizzes</a>
      <a href="/study-plan" class="nav-link active"><span class="nav-icon">📅</span> Study Plan</a>
      <a href="/revision" class="nav-link"><span class="nav-icon">🔄</span> Revision</a>
      <a href="/profile" class="nav-link"><span class="nav-icon">👤</span> Profile</a>
    </nav>
    <div class="sidebar-footer"><button onclick="logout()" class="btn btn-secondary w-full btn-sm">🚪 Logout</button></div>
  </aside>
  <div class="overlay-backdrop" id="backdrop"></div>
  <main class="main-content">
    <div class="top-bar">
      <div class="flex items-center gap-1">
        <button class="hamburger" onclick="document.getElementById('sidebar').classList.toggle('open');document.getElementById('backdrop').classList.toggle('open');">☰</button>
        <h1 style="font-size:18px;font-weight:700;margin:0;">Personalized Study Plan</h1>
      </div>
      <span class="text-muted text-sm" id="user-display-name"></span>
    </div>
    <div class="page-content">
      <div style="max-width:800px;margin:0 auto;">
        <div class="card mb-3">
          <div class="card-header">📅 Generate Study Plan</div>
          <div class="card-body">
            <div class="alert alert-info mb-2">StudyGenie will automatically prioritize your weak topics when building your plan.</div>
            <form id="plan-form">
              <div class="grid grid-2 mb-2">
                <div class="form-group mb-0">
                  <label class="form-label">Subject</label>
                  <select id="plan-subject" class="form-control form-select"></select>
                </div>
                <div class="form-group mb-0">
                  <label class="form-label">Study Hours Per Day</label>
                  <select id="hours-per-day" class="form-control form-select">
                    <option value="1">1 hour</option>
                    <option value="2" selected>2 hours</option>
                    <option value="3">3 hours</option>
                    <option value="4">4 hours</option>
                    <option value="6">6 hours</option>
                  </select>
                </div>
              </div>
              <div class="grid grid-2 mb-2">
                <div class="form-group mb-0">
                  <label class="form-label">Duration (Days)</label>
                  <select id="duration-days" class="form-control form-select">
                    <option value="3">3 days</option>
                    <option value="7" selected>7 days</option>
                    <option value="14">14 days</option>
                    <option value="21">21 days</option>
                    <option value="30">30 days</option>
                  </select>
                </div>
                <div class="form-group mb-0">
                  <label class="form-label">Exam Date (optional)</label>
                  <input type="date" id="exam-date" class="form-control">
                </div>
              </div>
              <button type="submit" class="btn btn-primary" id="plan-btn">Generate My Study Plan</button>
            </form>
          </div>
        </div>

        <div id="plan-display"></div>
      </div>
    </div>
  </main>
</div>
<div class="toast-container"></div>
<script src="/static/js/main.js"></script>
<script src="/static/js/planner.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  requireAuth();
  const params = new URLSearchParams(window.location.search);
  if (params.get('subject_id')) { setTimeout(() => { document.getElementById('plan-subject').value = params.get('subject_id'); }, 500); }
});
</script>
</body>
</html>
